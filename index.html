<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solicio AI - Zero-Backend Shorts Generator</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- YouTube Iframe API -->
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

  <div class="sidebar">
    <h2>Solicio AI</h2>
    <p class="hint">Instant Short-Form Clip Generator</p>
    <hr />
    <label for="apiKeyInput">Gemini API Key:</label>
    <input type="password" id="apiKeyInput" placeholder="AIzaSy..." />
    <button id="saveKeyBtn">Save API Key</button>
    <p id="keyStatus" class="hint">Stored locally in browser</p>
  </div>

  <div class="main-content">
    <h1>Solicio Clip Engine</h1>
    <p>Paste a YouTube URL to automatically detect viral highlights and generate pre-cut 9:16 vertical shorts.</p>

    <div class="input-group">
      <input type="text" id="ytUrlInput" placeholder="https://www.youtube.com/watch?v=..." />
      <button id="analyzeBtn" class="btn-primary">Analyze Video</button>
    </div>

    <p id="statusText" class="status-msg"></p>

    <!-- Pre-cut Clip Cards rendered here -->
    <div id="clipsGrid" class="clips-grid"></div>

    <!-- Hidden processing container for real-time canvas capture -->
    <div id="hiddenCaptureContainer" style="display: none;">
      <div id="ytPlayer"></div>
      <canvas id="cropCanvas" width="720" height="1280"></canvas>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
