<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicio AI - Turn Videos into Shorts</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Solicio AI</h1>
    <p class="subtitle">Client-Side YouTube Clip Extractor</p>

    <!-- Main Input Form -->
    <form id="process-form">
      <div class="form-group">
        <label for="youtube-url">YouTube Video URL:</label>
        <input 
          type="text" 
          id="youtube-url" 
          placeholder="https://www.youtube.com/watch?v=..." 
          required
        >
      </div>

      <div class="form-group">
        <label for="api-key">Gemini API Key:</label>
        <input 
          type="password" 
          id="api-key" 
          placeholder="Enter your Gemini API key"
        >
      </div>

      <button type="submit" id="submit-btn">Analyze Video</button>
    </form>

    <!-- System Console Output -->
    <div id="console-output" class="console-box">
      <p>[system]: Ready.</p>
    </div>

    <!-- YouTube Video Mount Container -->
    <div class="video-section">
      <h3>Video Preview</h3>
      <div id="player"></div>
    </div>

    <!-- Highlight Output Grid -->
    <div class="results-section">
      <h3>Detected Viral Clips</h3>
      <div id="clips-grid" class="clips-container"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
